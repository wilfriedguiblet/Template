# Run from the repository root with:
# nextflow run main.nf -params-file params.yaml

samplesheet: "assets/samplesheet.csv"
outdir: "results/example_run"
run_manifest: false            # optional central manifest; task sidecars are always written
load_modules: false             # set true on clusters with a python/3.10 environment module
container: "pipeline-template:1.0.0"

# Resource ceilings applied to process requests.
max_memory: "256 GB"
max_cpus: 64
max_time: "72 h"

# SLURM settings; set slurm_account when required by your site.
slurm_account: null
slurm_partition: "norm"